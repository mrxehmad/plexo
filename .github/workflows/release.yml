name: Release

# Pushing a version tag (git tag v1.0.0-rc.15 && git push origin v1.0.0-rc.15) builds the Linux
# packages (AppImage and deb, x64 and arm64) and leaves a draft GitHub Release. Apps only see it
# once the draft is published.
#
# Run by hand (gh workflow run release.yml --ref <branch>) it's a dry run: the same build, and no
# release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The tag names the version the build gets; a mismatch would ship one version as another. The
      # changelog entry becomes the release notes. Both are checked before the long build.
      - name: Check the tag matches package.json and has a changelog entry
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" --changelog > /dev/null

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build
          npx electron-builder --linux --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          node scripts/release-notes.mjs "$TAG" --files > "$RUNNER_TEMP/files.txt"
          # Not --prerelease, even for an rc: the app updates to the release GitHub marks Latest,
          # and a pre-release never is (see src/main/updater.ts).
          xargs -d '\n' gh release create "$TAG" --draft --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" < "$RUNNER_TEMP/files.txt"
